/* Layout: one gold handheld console centered on a night-sky page; screen on top, controls below. Single committed look. */
:root{

[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--cream);font-family:var(--f-body);

.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 12% 22%,#fff8 50%,transparent 51%),radial-gradient(1.5px 1.5px at 72% 12%,#fff6 50%,transparent 51%),radial-gradient(2px 2px at 88% 42%,#ffe27a88 50%,transparent 51%),radial-gradient(1.5px 1.5px at 32% 68%,#fff5 50%,transparent 51%),radial-gradient(2px 2px at 8% 86%,#ffe27a66 50%,transparent 51%),radial-gradient(1.5px 1.5px at 58% 92%,#fff5 50%,transparent 51%)}
.console{position:relative;width:100%;max-width:700px;background:linear-gradient(160deg,var(--shell-hi),var(--shell) 35%,var(--shell-lo));border-radius:22px 22px 70px 22px;
  padding:18px 18px 26px;box-sizing:border-box;box-shadow:0 0 0 4px #00000033 inset,0 18px 40px #0008,0 0 0 3px #3d2a0a}
.bezel{position:relative;background:var(--bezel);border-radius:12px 12px 40px 12px;padding:14px 18px 12px;box-shadow:inset 0 3px 0 #0006}
.bezel-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-family:var(--f-display);font-size:9px;letter-spacing:.12em;color:#b9b3dc}
.bezel-top .line{flex:1;height:3px;background:linear-gradient(90deg,var(--berry) 0 33%,#3f7fe0 33% 66%,#25a465 66%)}
.led{width:10px;height:10px;border-radius:50%;background:#ff4a5a;box-shadow:0 0 10px #ff4a5a}
canvas#screen{display:block;width:100%;max-width:640px;aspect-ratio:640/576;margin:0 auto;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border-radius:4px;touch-action:none}
.brand{display:flex;justify-content:space-between;align-items:baseline;margin:14px 6px 4px;color:var(--ink)}
.brand b{font-family:var(--f-display);font-size:clamp(10px,2.4vw,15px);letter-spacing:.06em}
.brand span{font-size:clamp(14px,3vw,18px);opacity:.75}
.pad{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;margin-top:10px;padding-inline:6px}
.dpad{position:relative;width:132px;height:132px}
.dpad button{position:absolute;width:44px;height:44px;background:#2d2a45;border:0;padding:0;cursor:pointer;color:#8a84b8;font-size:14px;touch-action:none}
.dpad .u{left:44px;top:0;border-radius:8px 8px 0 0}.dpad .d{left:44px;bottom:0;border-radius:0 0 8px 8px}
.dpad .l{left:0;top:44px;border-radius:8px 0 0 8px}.dpad .r{right:0;top:44px;border-radius:0 8px 8px 0}
.dpad .c{left:44px;top:44px;width:44px;height:44px;background:#2d2a45;position:absolute;border-radius:0}
.dpad button.on,.ab button.on,.pills button.on{filter:brightness(1.5);transform:translateY(2px)}
.ab{display:flex;gap:16px;transform:rotate(-20deg);justify-self:end}
.ab div{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);font-family:var(--f-display);font-size:10px}
.ab button{width:60px;height:60px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ee6a7c,var(--berry));box-shadow:0 4px 0 #7a1e2c;cursor:pointer;touch-action:none}
.ab div:first-child{margin-top:28px}
.pills{display:flex;gap:18px;justify-content:center;grid-column:1/-1}
.pills div{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--f-display);font-size:8px;color:var(--ink);letter-spacing:.1em}
.pills button{width:56px;height:14px;border-radius:8px;border:0;background:#5a5370;transform:rotate(-20deg);cursor:pointer;touch-action:none}
.name-dlg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,18,40,.55);border-radius:12px 12px 40px 12px;padding:16px}
.name-box{width:min(100%,360px);background:var(--cream);color:var(--ink);border:4px solid #3a3456;outline:3px solid #6b7fc4;outline-offset:-10px;border-radius:6px;padding:22px 24px 20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px #0008}
.name-box label{font-size:22px}
.name-row{display:flex;gap:8px;align-items:center}
.name-row input{flex:1;min-width:0;font-family:var(--f-body);font-size:24px;padding:8px 10px;border:3px solid #3a3456;border-radius:4px;background:#fff;color:var(--ink)}
.name-row span{font-size:20px;white-space:nowrap}
.name-box .hint{font-size:16px;color:#6a6680;margin:0}
.name-box .err{font-size:16px;color:#c8384e;margin:0;min-height:1em}
.name-box button{font-family:var(--f-body);font-size:22px;padding:8px;border:0;border-radius:4px;background:var(--berry);color:#fff;cursor:pointer;box-shadow:0 4px 0 #7a1e2c}
button:focus-visible,.name-row input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.help{max-width:700px;width:100%;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;font-size:17px;color:#cfc8f2}
.help kbd{font-family:var(--f-display);font-size:10px;background:#2f2a62;border:1px solid #4a4390;border-bottom-width:3px;border-radius:5px;padding:3px 6px;color:#fff}
@media (max-width:460px){.dpad{transform:scale(.82);transform-origin:left center;margin-right:-24px}.ab button{width:52px;height:52px}.console{border-radius:18px 18px 46px 18px;padding:12px 12px 18px}.bezel{padding:10px}}
@media (prefers-reduced-motion:reduce){.led{box-shadow:none}}
</style>

function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function hexRgb(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function rgbHex(r,g,b){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function shade(h,f){const[r,g,b]=hexRgb(h);if(f<0)return rgbHex(r*(1+f),g*(1+f),b*(1+f));return rgbHex(r+(255-r)*f,g+(255-g)*f,b+(255-b)*f);}
function rng(seed){let s=(seed*2654435761)>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}

class Grid{
  constructor(w,h){this.w=w;this.h=h;this.a=new Array(w*h).fill(null);}
  set(x,y,c){x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=this.w||y>=this.h)return;this.a[y*this.w+x]=c;}
  get(x,y){if(x<0||y<0||x>=this.w||y>=this.h)return null;return this.a[y*this.w+x];}
  rect(x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.set(x+i,y+j,c);}
  fill(c){this.a.fill(c);}
  disc(cx,cy,r,c){for(let y=Math.floor(cy-r-1);y<=cy+r+1;y++)for(let x=Math.floor(cx-r-1);x<=cx+r+1;x++){const dx=x+.5-cx,dy=y+.5-cy;if(dx*dx+dy*dy<=r*r)this.set(x,y,c);}}
  ell(cx,cy,rx,ry,c){for(let y=Math.floor(cy-ry-1);y<=cy+ry+1;y++)for(let x=Math.floor(cx-rx-1);x<=cx+rx+1;x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)this.set(x,y,c);}}
  ring(cx,cy,r,c){for(let y=Math.floor(cy-r-1);y<=cy+r+1;y++)for(let x=Math.floor(cx-r-1);x<=cx+r+1;x++){const dx=x+.5-cx,dy=y+.5-cy,d=Math.sqrt(dx*dx+dy*dy);if(d<=r&&d>r-1.2)this.set(x,y,c);}}
  hline(x0,x1,y,c){for(let x=Math.round(x0);x<=Math.round(x1);x++)this.set(x,y,c);}
  vline(x,y0,y1,c){for(let y=y0;y<=y1;y++)this.set(x,y,c);}
  line(x0,y0,x1,y1,c){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;for(;;){this.set(x0,y0,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
  pat(x,y,rows,map){rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const c=map[r[i]];if(c)this.set(x+i,y+j,c);}});}
  canvas(opt={}){
    const W=this.w,H=this.h;let a=this.a.slice();const at=(arr,x,y)=>(x<0||y<0||x>=W||y>=H)?null:arr[y*W+x];
    if(opt.shade){const b=a.slice();for(let y=0;y<H;y++)for(let x=0;x<W;x++){const p=a[y*W+x];if(!p||p===INK)continue;
      if(!at(a,x+1,y)||!at(a,x,y+1))b[y*W+x]=shade(p,-0.18);else if(!at(a,x-1,y)||!at(a,x,y-1))b[y*W+x]=shade(p,0.14);}a=b;}
    if(opt.outline){const b=a.slice();for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(a[y*W+x])continue;
      if(at(a,x+1,y)||at(a,x-1,y)||at(a,x,y+1)||at(a,x,y-1))b[y*W+x]=opt.outline;}a=b;}
    const c=mk(W,H),x=c.getContext('2d'),id=x.createImageData(W,H),cache={};
    for(let i=0;i<a.length;i++){const p=a[i];if(!p)continue;const rgb=cache[p]||(cache[p]=hexRgb(p));id.data[i*4]=rgb[0];id.data[i*4+1]=rgb[1];id.data[i*4+2]=rgb[2];id.data[i*4+3]=255;}
    x.putImageData(id,0,0);return c;
  }
}
function flipCanvas(c){const o=mk(c.width,c.height),x=o.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(c,0,0);return o;}

// ---------- BATTLE SPRITES (56x56) ----------
function makeStudent(L,back){
  const g=new Grid(56,56),cx=28,st=L.st||1,adult=!!L.adult;
  const hr=adult?10:st===1?13:st===2?12:11;
  const hy=adult?15:st===1?21:st===2?19:17;
  const skin=L.sk||'#ffd8b5',skinD=shade(skin,-.12),hair=L.hc||'#3a2a22',sh=L.sh||'#888',pa=L.pa||'#3b4a7a';
  const bt=hy+hr-2,bw=(adult?24:st===1?18:st===2?21:23)+(L.wide||0),bot=55;
  const half=y=>bw/2+(y-bt)*0.18;
  const acc=L.acc||[];

  if(acc.includes('halo'))g.ell(cx,hy-hr-4,9,2.5,'#ffe27a'),g.ell(cx,hy-hr-4,6.5,1.2,null);
  // cape
  if(L.cape){for(let y=bt+1;y<=bot;y++){const h=half(y)+4+(y-bt)*0.28;g.hline(cx-h,cx+h,y,L.cape);}}
  // back hair
  if(L.hs==='long'){g.disc(cx,hy,hr+2,hair);g.rect(cx-hr-2,hy,2*hr+4,back?hr+16:hr+11,hair);}
  if(L.hs==='bob'){g.disc(cx,hy,hr+2,hair);g.rect(cx-hr-2,hy,2*hr+4,hr-1,hair);}
  if(L.hs==='pig'){[-1,1].forEach(s=>{g.disc(cx+s*(hr+3),hy-1,4.5,hair);g.rect(cx+s*(hr+3)-2,hy,5,10,hair);g.disc(cx+s*(hr+3),hy+10,2.5,hair);g.set(cx+s*(hr+1),hy-4,'#ff6a8a');g.set(cx+s*(hr+1),hy-3,'#ff6a8a');});}
  if(L.hs==='pony'){g.disc(cx+hr-1,hy-hr+3,4.5,hair);g.rect(cx+hr,hy-hr+3,5,16,hair);g.disc(cx+hr+2,hy+5,3,hair);g.set(cx+hr-2,hy-hr+1,'#ff6a8a');g.set(cx+hr-3,hy-hr+2,'#ff6a8a');}
  // torso
  for(let y=bt;y<=bot;y++){const h=half(y);g.hline(cx-h,cx+h,y,sh);}
  const legY=adult?bot+2:bot-5;
  for(let y=legY;y<=bot;y++){const h=half(y)+(L.g==='f'&&!adult?1.5:0);g.hline(cx-h,cx+h,y,pa);}
  if(L.g!=='f'||adult){if(legY<=bot)g.vline(cx,legY+1,bot,shade(pa,-.25));}
  // arms
  const ay=bt+3,ah=adult?17:st===1?12:14;

  g.disc(lx+2,ay+ah+1.5,2.7,skin);g.disc(rx+2,ay+ah+1.5,2.7,skin);
  // collar / shirt detail
  if(!back){g.pat(cx-4,bt,['ww..ww','.ww.ww'.slice(0,6),'..ww..'],{w:'#ffffff'});
    if(st>=2&&!adult)g.rect(cx-1,bt+6,2,2,shade(sh,.35));}
  if(acc.includes('necklace')&&!back){for(let i=-5;i<=5;i+=2)g.set(cx+i,bt+2+Math.round(Math.abs(i)<3?2:Math.abs(i)<5?1:0),'#fbf6ea');g.disc(cx,bt+5,1.6,'#f2c94c');}
  if(acc.includes('tie')&&!back){g.rect(cx-1,bt+1,2,2,'#c43a3a');g.rect(cx-1,bt+3,3,6,'#c43a3a');g.vline(cx,bt+3,bt+8,'#a42a2a');}
  if(acc.includes('bowtie')&&!back){g.pat(cx-3,bt+1,['rr.rr','rrrrr','rr.rr'],{r:'#e23a5a'});}
  if(acc.includes('sash')&&!back){for(let i=0;i<20;i++){g.set(cx-9+i,bt+2+i,'#e2533b');g.set(cx-8+i,bt+2+i,'#e2533b');g.set(cx-7+i,bt+2+i,'#f08a6a');}}
  if(acc.includes('medal')&&!back){g.line(cx-3,bt+1,cx,bt+7,'#3f7fe0');g.line(cx+3,bt+1,cx,bt+7,'#e2533b');g.disc(cx,bt+9,3,'#f2c94c');g.set(cx-1,bt+8,'#fff6b0');}

    if(L.glasses){const GL='#3a4a7a';[ex1,ex2].forEach(ex=>{g.hline(ex-2,ex+3,ey-1,GL);g.hline(ex-2,ex+3,ey+4,GL);g.vline(ex-2,ey-1,ey+4,GL);g.vline(ex+3,ey-1,ey+4,GL);});g.hline(ex1+4,ex2-3,ey,GL);}
    if(!adult){g.rect(cx-9,hy+5,3,2,'#f6a8a2');g.rect(cx+6,hy+5,3,2,'#f6a8a2');}
    const my=hy+(adult?6:7),MC='#7a2e2e';
    switch(L.mouth){

      case 'grin':g.hline(cx-3,cx+2,my,MC);g.hline(cx-2,cx+1,my+1,'#ffffff');g.hline(cx-2,cx+1,my+2,MC);break;
      case 'flat':g.hline(cx-1,cx,my+1,MC);break;
      default:g.set(cx-2,my,MC);g.set(cx+1,my,MC);g.hline(cx-1,cx,my+1,MC);}
    if(acc.includes('wrinkle')){g.set(ex1-1,ey+4,'#e2b392');g.set(ex1,ey+4,'#e2b392');g.set(ex2+1,ey+4,'#e2b392');g.set(ex2+2,ey+4,'#e2b392');g.set(cx-4,my-1,'#e2b392');g.set(cx+3,my-1,'#e2b392');g.rect(cx-8,hy+4,2,1,'#f2b0a6');g.rect(cx+6,hy+4,2,1,'#f2b0a6');}
    if(acc.includes('mustache'))g.pat(cx-4,my-2,['mmm..mmm','.mmmmmm.'],{m:'#bdbdbd'});

  }

  if(acc.includes('goggles')&&!back){g.hline(cx-hr,cx+hr,hy-hr+5,'#4a4a5a');g.disc(cx-4,hy-hr+5,2.6,'#8ad8f0');g.disc(cx+4,hy-hr+5,2.6,'#8ad8f0');g.set(cx-5,hy-hr+4,'#fff');g.set(cx+3,hy-hr+4,'#fff');}
  if(acc.includes('cap')){g.rect(cx-hr-2,hy-hr-1,2*hr+4,3,'#22222e');g.rect(cx-6,hy-hr+1,12,3,'#22222e');g.vline(cx+hr+1,hy-hr+1,hy-hr+7,'#f2c94c');g.set(cx+hr+1,hy-hr+8,'#f2c94c');}
  if(acc.includes('capb')){const cy0=hy-hr+5;for(let y=Math.floor(cy0-hr);y<cy0;y++)for(let x=cx-hr;x<=cx+hr;x++){const dx=x+.5-cx,dy=y+.5-cy0;if(dx*dx+dy*dy<=(hr-.5)*(hr-.5))g.set(x,y,'#e8a23a');}g.set(cx,cy0-hr,'#c8822a');if(!back)g.rect(cx-hr-3,cy0-1,hr+5,2,'#c8822a');}
  if(acc.includes('beret')){g.ell(cx-2,hy-hr+1,hr-1,4,'#e23a5a');g.set(cx-2,hy-hr-4,'#e23a5a');}
  if(acc.includes('crown')){g.pat(cx-6,hy-hr-5,['y..y..y..y.','yy.yy.yy.yy','yyyyyyyyyyy','yryyyyyyry.'.slice(0,11)],{y:'#f2c94c',r:'#e23a5a'});}
  if(acc.includes('tophat')){g.rect(cx-hr-1,hy-hr+1,2*hr+2,3,'#22222e');g.rect(cx-6,hy-hr-9,12,10,'#22222e');g.rect(cx-6,hy-hr-1,12,2,'#c43a3a');}

  // held item (right hand)

function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=soundOn?0.16:0;master.connect(AC.destination);}catch(e){AC=null;}

let frame=0,scene='title',busy=0,fade=0,flash=0;
const waiters=[];
function wait(n){return new Promise(r=>waiters.push({t:frame+Math.max(1,n),r}));}
function tickWaiters(){for(let i=waiters.length-1;i>=0;i--){if(waiters[i].t<=frame){const w=waiters.splice(i,1)[0];w.r();}}}
async function fadeTo(v,n=12){const s=fade;for(let i=1;i<=n;i++){fade=s+(v-s)*i/n;await wait(1);}fade=v;}

// ---- josa ----
function jong(w){const c=w.charCodeAt(w.length-1);if(/[0-9]$/.test(w))return [21,8,0,16,0,0,1,8,8,0][+w[w.length-1]];if(c<0xAC00||c>0xD7A3)return 0;return (c-0xAC00)%28;}
function jo(w,p){const[a,b]=p.split('/');if(p==='으로/로'){const j=jong(w);return w+((j&&j!==8)?'으로':'로');}return w+(jong(w)?a:b);}

const held={};const pressQ=[];
const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right',
  z:'A',Z:'A',' ':'A',j:'A',J:'A',x:'B',X:'B',Escape:'B',Backspace:'B',k:'B',K:'B',Enter:'START',Shift:'SELECT'};

addEventListener('keydown',e=>{if(nameOpen||(e.target&&e.target.tagName==='INPUT'))return;const b=KEYMAP[e.key];if(!b)return;e.preventDefault();if(!e.repeat)press(b);else if(['up','down','left','right'].includes(b)&&ui.length)press(b);held[b]=true;});
addEventListener('keyup',e=>{const b=KEYMAP[e.key];if(b)held[b]=false;});
addEventListener('blur',()=>{for(const k in held)held[k]=false;});

  const up=e=>{el.classList.remove('on');held[b]=false;};
  el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);
  el.addEventListener('contextmenu',e=>e.preventDefault());});

// ---- UI stack ----
const ui=[];
function pushUI(e){ui.push(e);return e;}
function popUI(e){const i=ui.indexOf(e);if(i>=0)ui.splice(i,1);}

// ---- drawing helpers ----
function font(sz,w){ctx.font=`${w||''} ${sz}px ${FONT}`;}
function txt(s,x,y,o={}){font(o.size||28,o.weight);ctx.textBaseline='top';ctx.textAlign=o.align||'left';
  if(o.shadow){ctx.fillStyle=o.shadow;ctx.fillText(s,x+2,y+2);}
  ctx.fillStyle=o.color||COL.ink;ctx.fillText(s,x,y);ctx.textAlign='left';}
function box(x,y,w,h,o={}){
  ctx.fillStyle=COL.frame;ctx.fillRect(x,y,w,h);
  ctx.fillStyle=o.bg||COL.paper;ctx.fillRect(x+4,y+4,w-8,h-8);
  ctx.fillStyle=o.line||COL.line;ctx.fillRect(x+8,y+8,w-16,3);ctx.fillRect(x+8,y+h-11,w-16,3);ctx.fillRect(x+8,y+8,3,h-16);ctx.fillRect(x+w-11,y+8,3,h-16);
  ctx.fillStyle=o.bg||COL.paper;ctx.fillRect(x+11,y+11,w-22,h-22);
  // corner studs
  ctx.fillStyle=COL.gold;[[x+6,y+6],[x+w-12,y+6],[x+6,y+h-12],[x+w-12,y+h-12]].forEach(([a,b])=>ctx.fillRect(a,b,6,6));
}
function cursor(x,y,c){ctx.fillStyle=c||COL.ink;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+14,y+10);ctx.lineTo(x,y+20);ctx.closePath();ctx.fill();}
function downArrow(x,y){if((frame>>4)&1)return;ctx.fillStyle=COL.ink;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+16,y);ctx.lineTo(x+8,y+10);ctx.closePath();ctx.fill();}
function typeChip(t,x,y,w=76){const T=TYPES[t];ctx.fillStyle=shade(T.c,-.25);ctx.fillRect(x,y,w,28);ctx.fillStyle=T.c;ctx.fillRect(x+2,y+2,w-4,24);txt(T.n,x+w/2,y+3,{size:20,color:'#fff',align:'center'});}
function statusChip(s,x,y){if(!s)return;ctx.fillStyle=STATUSC[s];ctx.fillRect(x,y,52,26);txt(STATUSN[s],x+26,y+2,{size:20,color:'#fff',align:'center'});}
function hpColor(r){return r>.5?'#3cc062':r>.2?'#f2b62a':'#e2533b';}
function hpBar(x,y,w,r){ctx.fillStyle=COL.frame;ctx.fillRect(x,y,w,16);ctx.fillStyle='#e8e4d8';ctx.fillRect(x+3,y+3,w-6,10);
  ctx.fillStyle=hpColor(r);ctx.fillRect(x+3,y+3,Math.max(0,Math.round((w-6)*r)),10);ctx.fillStyle='rgba(255,255,255,.45)';ctx.fillRect(x+3,y+3,Math.max(0,Math.round((w-6)*r)),3);}
function drawSprite(c,x,y,s){ctx.imageSmoothingEnabled=false;ctx.drawImage(c,x,y,c.width*s,c.height*s);}

// ---- text wrapping ----
function wrap(s,maxW,size=30){font(size);const out=[];s.split('\n').forEach(par=>{const words=par.split(' ');let line='';
  words.forEach(wd=>{const test=line?line+' '+wd:wd;if(ctx.measureText(test).width<=maxW)line=test;else{if(line)out.push(line);
    if(ctx.measureText(wd).width>maxW){let l='';for(const ch of wd){if(ctx.measureText(l+ch).width>maxW){out.push(l);l=ch;}else l+=ch;}line=l;}else line=wd;}});
  out.push(line);});return out;}

class TextBox{
  constructor(text,opt={}){this.lines=wrap(text,560,30);this.pages=[];for(let i=0;i<this.lines.length;i+=2)this.pages.push(this.lines.slice(i,i+2));this.pi=0;this.ch=0;this.opt=opt;this.idle=0;}
  get page(){return this.pages[this.pi];}
  get total(){return this.page.join('').length;}
  update(){if(this.ch<this.total)this.ch+=this.opt.fast?4:2;else{this.idle++;if(this.opt.auto&&this.idle>this.opt.auto)this.advance();}}
  advance(){if(this.ch<this.total){this.ch=this.total;return;}if(this.pi<this.pages.length-1){this.pi++;this.ch=0;this.idle=0;return;}
    if(this.finished)return;this.finished=true;if(!this.opt.stay)popUI(this);this.res&&this.res(this);}
  key(k){if(k==='A'||k==='B'){if(this.finished)return;sfx('blip');this.advance();}}
  draw(){box(0,428,640,148);let n=this.ch;this.page.forEach((l,i)=>{const s=l.slice(0,Math.max(0,n));n-=l.length;txt(s,32,456+i*50,{size:30});});
    if(this.ch>=this.total&&!this.finished&&!this.opt.auto)downArrow(596,540);}
}
function say(text,opt={}){return new Promise(res=>{const t=new TextBox(text,opt);t.res=res;pushUI(t);});}
async function sayAll(arr){for(const s of arr)await say(s);}

class Choice{
  constructor(items,opt={}){this.items=items;this.cur=opt.start||0;this.opt=opt;const n=items.length;this.w=opt.w||220;this.h=opt.h||(36+n*46);
    this.x=opt.x!==undefined?opt.x:640-this.w-8;this.y=opt.y!==undefined?opt.y:428-this.h-4;}
  key(k){const n=this.items.length;
    if(k==='up'){this.cur=(this.cur+n-1)%n;sfx('blip');this.opt.onMove&&this.opt.onMove(this.cur);}
    else if(k==='down'){this.cur=(this.cur+1)%n;sfx('blip');this.opt.onMove&&this.opt.onMove(this.cur);}
    else if(k==='A'){sfx('select');popUI(this);this.res(this.cur);}

  draw(){box(this.x,this.y,this.w,this.h);this.items.forEach((it,i)=>{const lab=typeof it==='string'?it:it.label;const dis=typeof it==='object'&&it.dis;
    txt(lab,this.x+46,this.y+22+i*46,{size:28,color:dis?COL.dim:COL.ink});if(i===this.cur)cursor(this.x+22,this.y+25+i*46);});}
}

// ---- creatures ----
function expFor(lv){return lv<=1?0:Math.floor(lv*lv*lv*0.6);}
function calcStats(m){const b=SP[m.sp].b,o={};SKEYS.forEach((k,i)=>{const v=Math.floor((b[i]*2+m.iv[i])*m.lv/100);o[k]=k==='hp'?v+m.lv+10:v+5;});return o;}
function maxHP(m){return calcStats(m).hp;}
function mkMon(sp,lv){const m={sp,lv,exp:expFor(lv),iv:SKEYS.map(()=>Math.floor(Math.random()*16)),moves:[],status:null,slp:0};
  const learn=SP[sp].ls.filter(([l])=>l<=lv).map(x=>x[1]);const uniq=[...new Set(learn)];uniq.slice(-4).forEach(id=>m.moves.push({id,pp:MOVES[id].pp}));
  m.hp=maxHP(m);return m;}
function nameOf(m){return SP[m.sp].n;}
function healAll(){G.party.forEach(m=>{m.hp=maxHP(m);m.status=null;m.slp=0;m.moves.forEach(mv=>mv.pp=MOVES[mv.id].pp);});}
function ableCount(){return G.party.filter(m=>m.hp>0).length;}
function markSeen(sp){G.seen[sp]=1;}
function markCaught(sp){G.seen[sp]=1;G.caught[sp]=1;}
function addMon(m){markCaught(m.sp);if(G.party.length<6){G.party.push(m);return 'party';}G.box.push(m);return 'box';}

// ===================== WORLD =====================
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const OPP={up:'down',down:'up',left:'right',right:'left'};
let MAP=null,npcs=[],objs=[];
const P={x:0,y:0,d:'down',mv:null,steps:0,turn:0};
let popup={t:0,name:''};

function tileAt(x,y){const r=MAP.rows[y];if(!r||x<0||x>=r.length)return MAP.border;return r[x];}
function hashXY(x,y){return ((x*73856093)^(y*19349663))>>>0;}
function occupied(x,y,self){
  for(const n of npcs){if(n===self)continue;if((n.x===x&&n.y===y)||(n.mv&&n.mv.tx===x&&n.mv.ty===y))return true;}
  for(const o of objs)if(o.x===x&&o.y===y)return true;
  if(self!==P&&((P.x===x&&P.y===y)||(P.mv&&P.mv.tx===x&&P.mv.ty===y)))return true;return false;}
function blocked(x,y,self){return SOLID.has(tileAt(x,y))||occupied(x,y,self);}

function buildEntities(){
  const old={};npcs.forEach(n=>old[n.id]=n);
  npcs=(MAP.npcs||[]).filter(n=>!n.show||n.show()).filter(n=>!n.hidden).map(n=>old[n.id]||{...n,home:[n.x,n.y],mv:null,bubble:0,def:n});
  objs=(MAP.objs||[]).filter(o=>!G.flags[o.id]).map(o=>({...o,spr:makeObj(o.kind,o.col||'#e2533b')}));
}
function loadMap(id,x,y,d){MAP=MAPS[id];G.map=id;P.x=x;P.y=y;P.d=d||P.d;P.mv=null;npcs=[];buildEntities();playMusic(MAP.music);popup={t:150,name:MAP.name};}

async function doWarp(w){
  if(w.cond&&!w.cond()){await w.deny();const[dx,dy]=DIRS[P.d];P.x-=dx;P.y-=dy;return;}
  sfx('door');await fadeTo(1,10);loadMap(w.to,w.tx,w.ty,w.d);await wait(4);await fadeTo(0,10);
  checkSight();
}
async function runScript(fn){busy++;try{await fn();if(busy===1&&scene==='world')await questCheck();}catch(e){console.error(e);}finally{busy--;buildEntities();}}

function npcStep(n,dir,speed=12){return new Promise(res=>{n.d=dir;const[dx,dy]=DIRS[dir];n.mv={tx:n.x+dx,ty:n.y+dy,dx,dy,t:0,n:speed,res};});}
async function walkTo(n,tx,ty){let guard=30;while((n.x!==tx||n.y!==ty)&&guard--){const dir=n.x<tx?'right':n.x>tx?'left':n.y<ty?'down':'up';await npcStep(n,dir);}}

function updateNPCs(){
  for(const n of npcs){
    if(n.mv){n.mv.t++;if(n.mv.t>=n.mv.n){n.x=n.mv.tx;n.y=n.mv.ty;const r=n.mv.res;n.mv=null;n.anim=(n.anim||0)+1;r&&r();}continue;}
    if(n.bubble>0)n.bubble--;
    if(n.w&&!busy&&!ui.length&&Math.random()<1/140){const dirs=['up','down','left','right'];const dir=dirs[Math.floor(Math.random()*4)];const[dx,dy]=DIRS[dir];
      const nx=n.x+dx,ny=n.y+dy;n.d=dir;if(Math.abs(nx-n.home[0])<=2&&Math.abs(ny-n.home[1])<=2&&!blocked(nx,ny,n)&&tileAt(nx,ny)!=='e'&&tileAt(nx,ny)!=='D')n.mv={tx:nx,ty:ny,dx,dy,t:0,n:16};}
  }
}
function updatePlayer(){
  if(P.mv){P.mv.t++;if(P.mv.t>=P.mv.n){P.x=P.mv.tx;P.y=P.mv.ty;P.mv=null;P.steps++;onStep();}return;}
  if(busy||ui.length||scene!=='world'||fade>0)return;
  const dir=['up','down','left','right'].find(d=>held[d]);if(!dir){P.turn=0;return;}
  if(P.d!==dir){P.d=dir;P.turn=5;return;}
  if(P.turn>0){P.turn--;return;}
  const[dx,dy]=DIRS[dir],nx=P.x+dx,ny=P.y+dy;
  if(blocked(nx,ny,P)){if(frame%18===0)sfx('bump');return;}
  P.mv={tx:nx,ty:ny,dx,dy,t:0,n:held.B?5:9};
}
function onStep(){
  const w=(MAP.warps||[]).find(w=>w.x===P.x&&w.y===P.y);if(w){runScript(()=>doWarp(w));return;}
  for(const ev of MAP.events||[]){if(ev.at(P.x,P.y)&&(!ev.cond||ev.cond())){runScript(ev.run);return;}}
  if(checkSight())return;
  const t=tileAt(P.x,P.y);const enc=t===','?MAP.enc&&MAP.enc.grass:t==='m'?MAP.enc&&MAP.enc.mat:null;
  if(enc&&Math.random()<1/9)runScript(()=>wildEncounter(enc));
}
function checkSight(){
  for(const n of npcs){const tr=n.tr;if(!tr||!tr.sight||G.flags[tr.id])continue;const[dx,dy]=DIRS[n.d];
    for(let i=1;i<=tr.sight;i++){const tx=n.x+dx*i,ty=n.y+dy*i;if(tx===P.x&&ty===P.y){runScript(()=>trainerSpotted(n));return true;}
      if(SOLID.has(tileAt(tx,ty))||occupied(tx,ty,n))break;}}
  return false;}
async function trainerSpotted(n){
  n.bubble=50;sfx('alert');await wait(50);
  const[dx,dy]=DIRS[n.d];let guard=12;while(Math.abs(n.x-P.x)+Math.abs(n.y-P.y)>1&&guard--)await npcStep(n,n.d);
  P.d=OPP[n.d];await wait(6);await trainerFight(n);
}
function interact(){
  const[dx,dy]=DIRS[P.d];let fx=P.x+dx,fy=P.y+dy;
  const o=objs.find(o=>o.x===fx&&o.y===fy);if(o){runScript(()=>o.s?o.s(o):pickItem(o));return;}
  let n=npcs.find(n=>n.x===fx&&n.y===fy&&!n.mv);
  if(!n&&tileAt(fx,fy)==='c'){n=npcs.find(n=>n.x===fx+dx&&n.y===fy+dy&&!n.mv);}
  if(n){n.d=OPP[P.d];runScript(()=>talkNPC(n));return;}
  const sg=MAP.signs&&MAP.signs[`${fx},${fy}`];if(sg){runScript(()=>say(sg));return;}
  const t=tileAt(fx,fy);
  const FL={b:'학습 만화, 위인전, 과학 잡지가 빼곡히 꽂혀 있다.',k:'칠판에 "오늘의 목표: 친구와 사이좋게 지내기!"라고 적혀 있다.',B:'하얀 시트가 깔린 침대다. 누우면 바로 잠들 것 같다.',
    i:'도~ 레~ 미~ 건반을 눌러 보았다.',w:'연못 속에서 잉어들이 느긋하게 헤엄치고 있다.',o:'실험 기구가 가지런히 놓여 있다. 함부로 만지면 안 된다!',s:'과자와 학용품이 진열되어 있다.',
    G:'축구 골대다. 그물에 공 자국이 잔뜩 있다.',Q:'농구 골대다. 엄청 높다.',L:'학생들의 사물함이다. 이름표가 붙어 있다.',d:'책상 위에 교과서와 필통이 놓여 있다.',p:'잘 자란 화분이다. 누군가 매일 물을 주는 것 같다.'};
  if(t==='P'){runScript(pcMenu);return;}
  if(FL[t])runScript(()=>say(FL[t]));
}
async function talkNPC(n){
  if(n.tr&&!G.flags[n.tr.id]){await trainerFight(n);return;}
  if(n.s){await n.s(n);return;}
  if(n.tr){await say(`${n.tr.name}: ${n.tr.after}`);return;}
  await say(n.t);
}
async function pickItem(o){sfx('select');G.flags[o.id]=1;addItem(o.item,o.n||1);
  await say(`${G.name} 선생님은 ${ITEMS[o.item].n}${o.n>1?' '+o.n+'개':''}${jong(ITEMS[o.item].n)&&!(o.n>1)?'을':'를'} 발견했다!`);}
async function giveItem(id,n=1){sfx('buy');addItem(id,n);await say(`${G.name} 선생님은 ${ITEMS[id].n} ${n}개를 받았다!`);}

// ---- trainer fights ----
async function trainerFight(n){
  const tr=n.tr;
  if(tr.pre)await say(`${tr.name}: ${tr.pre}`);
  const res=await battle({trainer:{...tr,team:tr.team.map(([s,l])=>mkMon(s,l))}});
  if(res==='win'){G.flags[tr.id]=1;
    if(tr.badge){G.badges.push(tr.badge);sfx('level');
      await say(`${G.name} 선생님은 ${tr.name}에게서 ${BADGES[tr.badge].n}을 받았다!`);
      await say(`${tr.name}: 이 도장은 학교가 인정한 담임 선생님이라는 증표예요.\n앞으로도 학생들과 함께 성장해 가세요!`);
      if(tr.gift)await giveItem(tr.gift[0],tr.gift[1]);
      if(tr.heal){healAll();sfx('heal');await say(`${tr.name}: 학생들이 많이 지쳤죠? 잠깐 쉬게 해 줄게요.\n(학생들의 집중력이 모두 회복되었다!)`);}
      if(G.badges.length===2){await wait(20);sfx('alert');
        await say('교내 방송: 딩동댕동~ 6학년 3반 선생님께 알립니다!');
        await say('교내 방송: 학년 대표 결정전에 꼭 필요한 학급 출석부를...\n개구쟁이 민호가 들고 뒷동산으로 도망갔다고 합니다!');
        await say('교내 방송: 뒷동산은 운동장 왼쪽 길로 나가면 됩니다. 서둘러 주세요~!');}
    }else if(tr.onWin)await tr.onWin(n);
    else if(tr.after)await say(`${tr.name}: ${tr.after}`);
  }else if(res==='lose')await blackout();
}
async function minhoWin(n){

async function blackout(){

const RIVAL='1반 하늘 선생님';
async function rivalBattle(n,k){
  const R=RIVAL;
  const pre={1:['어이, 3반 새 담임! 나는 6학년 1반 담임 하늘이다.','교장 선생님께 첫 학생을 받았지? 나도 방금 하나 데려왔어.\n누구 반이 최고인지 지금 바로 겨뤄 보자고!'],
    final:['역시 올라왔구나. 기다리고 있었어!','결정전 1라운드는 나, 하늘이다. 우리 1반도 그동안 놀지 않았다고!\n자, 전력으로 붙어 보자!']}[k];
  for(const s of pre)await say(`${R}: ${s}`);
  const lose={1:'칫... 시작부터 지다니. 하지만 우리 반은 더 강해질 거야!',final:'...졌다. 인정할게, 너희 반 진짜 강해.'}[k];
  const res=await battle({trainer:{id:'rival_'+k,name:R,tl:'rival',team:rivalTeam(k===1?1:2).map(([s,l])=>mkMon(s,l)),lose,reward:k===1?300:1500,canLose:k===1}});
  if(k===1){G.flags.rival1=1;
    if(res==='win')await say(`${R}: 흥, 이번엔 봐준 거야! 운동장 풀숲에서 학생들을 더 모아 보라고.\n결정전에서 다시 만나자!`);
    else{await say(`${R}: 하하! 1반 승리! 학생을 쉬게 해 줘. 결정전에서 다시 붙자고!`);healAll();await say('(학생들이 기운을 차렸다.)');}
    await rivalLeave(n);return res;}
  return res;
}
async function rivalLeave(n){if(!n)return;const live=npcs.find(x=>x.id===n.id);if(live){for(let i=0;i<3;i++){const dirs=['left','right','up','down'];for(const d of dirs){const[dx,dy]=DIRS[d];if(!blocked(live.x+dx,live.y+dy,live)){await npcStep(live,d,8);break;}}}npcs=npcs.filter(x=>x!==live);}}
async function rivalFirst(){
  const n=npcs.find(x=>x.id==='rival');if(!n)return;
  n.bubble=50;sfx('alert');await wait(40);
  await walkTo(n,P.x,P.y-1).catch(()=>{});
  // ensure adjacent
  P.d=n.y<P.y?'up':n.y>P.y?'down':n.x<P.x?'left':'right';n.d=OPP[P.d];
  await rivalBattle(n,1);
}

function pre(w){return (w.side==='e'?'상대 ':'')+nameOf(w.m);}

function effStat(w,k,crit,isAtk){let s=w.stg[k]||0;if(crit){if(isAtk&&s<0)s=0;if(!isAtk&&s>0)s=0;}const mul=s>=0?(2+s)/2:2/(2-s);let v=calcStats(w.m)[k]*mul;if(k==='spd'&&w.m.status==='DAZE')v*=.5;return v;}

function calcDamage(att,def,mv,crit){
  const cat=TYPES[mv.t].stat,A=effStat(att,cat,crit,true),D=Math.max(1,effStat(def,cat,crit,false)),lv=att.m.lv;
  const base=Math.floor(Math.floor((Math.floor(2*lv/5)+2)*mv.p*A/D)/50)+2;
  const stab=typesOf(att).includes(mv.t)?1.5:1,te=mv.t==='NONE'?1:typeEff(mv.t,typesOf(def));
  let d=Math.floor(base*stab*te*(crit?1.5:1)*(0.85+Math.random()*0.15));if(te>0)d=Math.max(1,d);return{d,te};}

async function useMove(att,def,idx){

  newGame();await intro();
}

  const el={key(k){if((k==='A'||k==='START')&&t>200){popUI(el);res();}},
    draw(){t++;ctx.fillStyle='rgba(20,18,28,.86)';ctx.fillRect(0,0,640,576);const y0=576-t*1.1;lines.forEach((l,i)=>{const y=y0+i*44;if(y<-40||y>600)return;const big=i===0||l==='THE END';txt(l,320,y,{size:big?40:26,color:big?'#ffe27a':'#ffffff',align:'center'});});
      if(y0+lines.length*44<200){txt('A 버튼을 눌러 계속',320,520,{size:22,color:'#bdb8d8',align:'center'});}}};pushUI(el);});}

// ===================== MAIN LOOP =====================
function update(){
  frame++;tickWaiters();
  while(pressQ.length){const k=pressQ.shift();const top=ui[ui.length-1];
    if(top){top.key&&top.key(k);continue;}
    if(scene==='evo'&&k==='B'&&EVO){EVO.cancel=true;continue;}
    if(scene==='world'&&!busy&&!P.mv&&fade===0){if(k==='A')interact();else if(k==='START'||k==='SELECT'){sfx('select');runScript(startMenu);}}}
  const top=ui[ui.length-1];if(top&&top.update)top.update();
  if(scene==='world'&&MAP){updatePlayer();updateNPCs();if(G)G.time+=1/60;}
}
function render(){
  ctx.imageSmoothingEnabled=false;
  if(scene==='title')drawTitle();else if(scene==='intro')drawIntro();else if(scene==='world'&&MAP)drawWorld();else if(scene==='battle'&&B)drawBattle();else if(scene==='evo'&&EVO)drawEvo();else if(scene==='ending')drawEnding();
  else{ctx.fillStyle='#000';ctx.fillRect(0,0,640,576);}
  drawTrans();
  for(const e of ui)if(!e.hidden)e.draw();
  if(fade>0){ctx.fillStyle=`rgba(10,8,16,${fade})`;ctx.fillRect(0,0,640,576);}
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash})`;ctx.fillRect(0,0,640,576);}
}
let lastT=performance.now(),accT=0;
function loop(now){requestAnimationFrame(loop);accT+=Math.min(100,now-lastT);lastT=now;let n=0;while(accT>=1000/60&&n<4){update();accT-=1000/60;n++;}render();}

async function boot(data){
  try{await Promise.race([Promise.all([document.fonts.load(`30px "Do Hyeon"`),document.fonts.load(`16px "Press Start 2P"`)]),new Promise(r=>setTimeout(r,2500))]);}catch(e){}
  requestAnimationFrame(loop);
  if(data&&data.G){G=data.G;scene='world';loadMap(G.map,G.x,G.y,G.d);initQuest();return;}
  await titleFlow();
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({G:(scene==='world'&&G&&MAP&&!busy)?{...G,x:P.x,y:P.y,d:P.d}:null}));}catch(e){}
(window.claude&&window.claude.hot&&window.claude.hot.ready)?window.claude.hot.ready(boot):boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
